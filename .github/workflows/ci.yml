name: CI

on:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: src/OnlyRag.Web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: src/OnlyRag.Web

      - name: Run repository checks
        shell: pwsh
        run: .\scripts\Test-All.ps1 -Configuration Release
