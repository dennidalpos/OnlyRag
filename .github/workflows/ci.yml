name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: src/OnlyRag.Web/package-lock.json

      - name: Run repository gate and security audits
        shell: pwsh
        run: .\scripts\Invoke-Gate.ps1 -Configuration Release -IncludeAudits
